name: Build AMD Docker image

on:
  push:
    branches: ["main"]
    paths:
      - 'subgen.py'
      - 'language_code.py'
      - 'launcher.py'
      - 'requirements.txt'
      - 'entrypoint.sh'
      - 'Dockerfile.AMD'
      - '.github/workflows/build_amd.yml'
  workflow_dispatch:

concurrency:
  group: docker-amd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from subgen.py
        run: |
          version=$(grep -oP "subgen_version\s*=\s*'\K[^']+" subgen.py)
          echo "version=$version" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.AMD
          platforms: linux/amd64
          push: true
          tags: |
            flash1228/subgen-parakeet:amd
            flash1228/subgen-parakeet:${{ env.version }}-amd
          cache-from: type=registry,ref=flash1228/subgen-parakeet:amd-buildcache
          cache-to: type=registry,ref=flash1228/subgen-parakeet:amd-buildcache,mode=max
